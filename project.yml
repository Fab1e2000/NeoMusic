name: NeoMusic
options:
  bundleIdPrefix: com.elsterlee
  deploymentTarget:
    iOS: "27.0"
  xcodeVersion: "27.0"
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  FrontAM:
    path: Packages/FrontAM
  AudioStreaming:
    path: Packages/AudioStreaming
  AudioTags:
    path: Packages/AudioTags
  Nuke:
    url: https://github.com/kean/Nuke
    exactVersion: 13.2.0
  LNSwiftUIUtils:
    url: https://github.com/LeoNatan/LNSwiftUIUtils.git
    exactVersion: 1.1.5
  LNSystemMarqueeLabel:
    url: https://github.com/LeoNatan/LNSystemMarqueeLabel
    exactVersion: 0.1.2
targets:
  NeoMusic:
    type: application
    platform: iOS
    sources:
      - path: NeoMusic
    dependencies:
      - package: FrontAM
        product: FrontAMPlayer
      - package: FrontAM
        product: FrontAMCore
      - package: FrontAM
        product: FrontAMPopup
      - package: FrontAM
        product: FrontAMNavigation
      - package: AudioStreaming
      - package: AudioTags
        product: AudioTagBridge
      - package: FrontAM
        product: FrontAMPages
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
    info:
      path: NeoMusic/Info.plist
      properties:
        CADisableMinimumFrameDurationOnPhone: true
        UIBackgroundModes: [audio]
        NSBluetoothAlwaysUsageDescription: 读取当前耳机型号，以显示对应的音频设备图标。
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: NeoMusicIcon
        DEVELOPMENT_ASSET_PATHS: NeoMusic/Resources/HomePreviewAssets.xcassets
        PRODUCT_BUNDLE_IDENTIFIER: com.elsterlee.NeoMusic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NeoMusic
        INFOPLIST_KEY_NSCameraUsageDescription: 拍摄照片作为播放列表封面。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: 0.0.2
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: NeoMusic/NeoMusic-Bridging-Header.h
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: HomePreviewAssets.xcassets
  FullScreenPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FullScreenPlayerTests
      - path: Packages/FrontAM/Tests/FrontAMPlayerTests
    dependencies:
      - package: FrontAM
        product: FrontAMPlayer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
  NeoMusicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NeoMusicTests
    dependencies:
      - target: NeoMusic
      - package: FrontAM
        product: FrontAMPlayer
      # The hosted bundle resolves FrontAMPages, FrontAMNavigation, FrontAMPopup and LNPopup symbols through NeoMusic.
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
  NeoMusicNavigationUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NeoMusicNavigationUITests
    dependencies:
      - target: NeoMusic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: NeoMusic


  NeoMusicFunctionalParityTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NeoMusicFunctionalParityTests
    dependencies:
      - target: NeoMusic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: NeoMusic

schemes:
  NeoMusicFunctionalParity:
    build:
      targets:
        NeoMusic: all
    test:
      language: zh-Hans
      targets:
        - NeoMusicFunctionalParityTests
    run:
      config: Debug
  NeoMusic:
    build:
      targets:
        NeoMusic: all
    test:
      language: zh-Hans
      targets:
        - NeoMusicTests
        - FullScreenPlayerTests
        - NeoMusicNavigationUITests
    run:
      config: Debug
    archive:
      config: Release
