name: FrontAMShowcase
options:
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  FrontAM:
    path: ../..
targets:
  FrontAMShowcase:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: FrontAM
        product: FrontAM
    info:
      path: Info.plist
      properties:
        CFBundleLocalizations: [en, zh-Hans]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FrontAM Showcase
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Choose an image to use as a demo playlist cover.
        INFOPLIST_KEY_NSCameraUsageDescription: Take a photo to use as a demo playlist cover.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.frontam.showcase
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  FrontAMShowcase:
    build:
      targets:
        FrontAMShowcase: all
    run:
      config: Debug
